<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Compt'Touns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Compt'Touns</h1>
      <p id="today-label" class="muted"></p>
      <p id="status" class="status" data-state="loading">Connexion…</p>
    </header>

    <section class="counters" aria-label="Compteurs du jour">
      <article class="counter" data-expr="notamment">
        <h2>« Notamment »</h2>
        <p class="count" aria-live="polite">0</p>
        <button class="plus" type="button" disabled>+1</button>
        <button class="minus" type="button" aria-label="Retirer 1 à notamment" disabled>−1</button>
      </article>
      <article class="counter" data-expr="on_va_dire">
        <h2>« On va dire »</h2>
        <p class="count" aria-live="polite">0</p>
        <button class="plus" type="button" disabled>+1</button>
        <button class="minus" type="button" aria-label="Retirer 1 à on va dire" disabled>−1</button>
      </article>
    </section>

    <section class="stats" aria-label="Statistiques">
      <div><span class="stat-value" id="stat-total">0</span><span class="muted">au total</span></div>
      <div><span class="stat-value" id="stat-avg">0</span><span class="muted">par jour (moy.)</span></div>
      <div><span class="stat-value" id="stat-record">0</span><span class="muted" id="stat-record-label">record</span></div>
    </section>

    <section aria-labelledby="chart-title">
      <h2 id="chart-title" class="section-title">14 derniers jours</h2>
      <div class="legend">
        <span><i class="dot notamment"></i>Notamment</span>
        <span><i class="dot on_va_dire"></i>On va dire</span>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section aria-labelledby="history-title">
      <h2 id="history-title" class="section-title">Historique</h2>
      <table class="history" hidden>
        <thead>
          <tr><th>Jour</th><th>Notamment</th><th>On va dire</th><th>Total</th></tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
      <p id="history-empty" class="muted empty">Rien pour l'instant. Attendez le premier « notamment ».</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
